version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: boardingbase_postgres
    restart: always
    ports: 
      - "5432:5432"
    environment:
      POSTGRES_USER: mondz
      POSTGRES_PASSWORD: monlitz123
      POSTGRES_DB: boardingbase
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: boardingbase
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: